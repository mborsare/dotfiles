[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
decorations = "full"
opacity = 0.95

[font]
normal = { family = "Comic Mono", style = "Normal" }
bold = { family = "Comic Mono", style = "Bold" }
size = 16.0
offset = { x = 0, y = 1 }

[colors.primary]
background = "#282a36"
foreground = "#f8f8f2"

[colors.cursor]
text = "#282a36"
cursor = "#f8f8f2"

[colors.selection]
text = "CellForeground"
background = "#44475a"

[colors.normal]
black = "#21222c"
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
magenta = "#ff79c6"
cyan = "#8be9fd"
white = "#f8f8f2"

[colors.bright]
black = "#6272a4"
red = "#ff6e6e"
green = "#69ff94"
yellow = "#ffffa5"
blue = "#d6acff"
magenta = "#ff92df"
cyan = "#a4ffff"
white = "#ffffff"

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 500
blink_timeout = 0

[terminal]
shell = { program = "/bin/zsh", args = ["-l"] }

# Cmd + [ ] → send Alt + [ ]
[keyboard]
bindings = [
  { key = "LBracket", mods = "Command", chars = "\u001b[" },
  { key = "RBracket", mods = "Command", chars = "\u001b]" }
]
