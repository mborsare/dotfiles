[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
decorations = "full"
opacity = 0.98

[colors]
# Apply opacity to the custom tmux pane backgrounds as well.
transparent_background_colors = true

[font]
normal = { family = "ComicShannsMono Nerd Font", style = "Regular" }
bold = { family = "ComicShannsMono Nerd Font", style = "Bold" }
size = 16.0
offset = { x = 0, y = 1 }

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 500
blink_timeout = 0

[terminal]
shell = { program = "/bin/zsh", args = ["-l"] }


[keyboard]
bindings = [
  { key = "V", mods = "Command", action = "Paste" },
  { key = "C", mods = "Command", action = "Copy" },
  { key = "LBracket", mods = "Command", chars = "\u001b[" },
  { key = "RBracket", mods = "Command", chars = "\u001b]" }
]
