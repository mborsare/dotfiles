# SIGNAL / aerc 2026
# A terminal-first mail client from a future where the web never won.
# Designed for macOS, Neovim, and a true-color terminal.
# This file controls presentation and behavior only.
# Accounts and credentials remain in accounts.conf, untouched.

[general]
# Respect modern terminal capabilities (links, clipboard, images).
inherit-host-tty-features = true
# Keep account-file permission enforcement.
unsafe-accounts-conf = false

[ui]
# Three-pane mail: folder rail / conversation list / reading surface.
sidebar-width = 21
message-list-split = h 14
border-char-vertical = "│"
border-char-horizontal = "─"
# threads
thread-prefix-tip = ""
thread-prefix-indent = " "
thread-prefix-stem = "│"
thread-prefix-limb = ""
thread-prefix-has-siblings = "├"
thread-prefix-last-sibling = "╰"
thread-prefix-folded = "▸"
thread-prefix-unfolded = ""

# A compact index that still carries the essentials.
index-columns = pin:2,name<21%,subject,date>=
column-pin = {{if .IsFlagged}}★{{else if .HasAttachment}}·{{end}}
column-name = {{if .ThreadPrefix}}{{replace `[^ ]` " " .ThreadPrefix}}{{end}}{{.Peer | names | join ", "}}
column-subject = {{if .ThreadPrefix}}{{.Style .ThreadPrefix "repeated"}}  {{end}}{{if .Subject}}{{.SubjectBase}}{{else if .SubjectBase}}{{.Style (printf "%s…" (.SubjectBase | head 0)) "repeated"}}{{else}}(no subject){{end}}
column-date = {{.DateAutoFormat .Date.Local}}
column-separator = "  "

# The thread is the unit of conversation.
threading-enabled = true
sort-thread-siblings = true
threading-by-subject = false
msglist-scroll-offset = 3

# Keep previews useful without silently marking mail as read.
auto-mark-read = true
auto-mark-read-split = false
next-message-on-delete = true

# Fast, discoverable interaction.
mouse-enabled = true
new-message-bell = false
fuzzy-complete = true
completion-popovers = true
completion-delay = 200ms
completion-min-chars = 1
keyhint = true
keyhint-delay = 300ms
keyhint-position = bottom-right

# Folder navigation and quiet empty states.
dirlist-tree = true
dirlist-collapse = 0
dirlist-delay = 120ms
empty-message = (nothing here)
empty-subject = (untitled)

# Theme lives in ~/.config/aerc/stylesets, even on macOS.
styleset-name = session

dirlist-left = {{.Folder}}
[statusline]
status-columns = left<*,right>=
column-left = {{.Account}}  /  {{.StatusInfo}}
column-right = {{.TrayInfo}}
column-separator = "  "
display-mode = text

[viewer]
# Real email reading: prefer the formatted body when available.
# For HTML, the 'html' filter below uses w3m. Install via MacPorts.
alternatives = text/html,text/plain
pager = less -Rc -+S --wordwrap
header-layout = From|To,Date,Subject
parse-http-links = true
# Avoid injecting embedded image data into terminal output by default.
html-inline-images = false

[compose]
# Writing is a craft, not a text area inside a website.
editor = nvim
empty-subject-warning = true
no-attachment-warning = ^[^>]*attach(ed|ment)
format-flowed = true

[multipart-converters]
# Optional: uncomment after installing pandoc to add HTML to
# Markdown-authored messages using aerc's :multipart command.
# text/html = pandoc -f markdown -t html --standalone

[filters]
# Specific MIME renderers first; keep the built-in, isolated HTML helper.
text/html = lynx -dump -stdin -nolist -width=100
text/plain = colorize
text/calendar = calendar
message/delivery-status = colorize
message/rfc822 = colorize
.headers = colorize

[openers]
# On macOS, open links and documents with their associated apps.
x-scheme-handler/http* = open
text/html = sh -c 'cp "$1" "${1%.*}.html" && open "${1%.*}.html"' sh {}
application/pdf = open
image/* = open

[hooks]
# Deliberately quiet: no notification spam or surprise side effects.

[templates]
# Retain aerc's standard compose, reply, and forward templates.
