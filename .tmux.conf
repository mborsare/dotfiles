
# ── Prefix ──────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Splits ──────────────────────────────────────────────────
bind h split-window -v
bind v split-window -h

# ── Pane Navigation ─────────────────────────────────────────
bind w select-pane -L
bind a select-pane -D
bind s select-pane -U
bind d select-pane -R

# Without prefix (Alt)
bind -n M-[ select-pane -L
bind -n M-] select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# ── Pane Resizing ───────────────────────────────────────────
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5

# ── Windows & Panes ─────────────────────────────────────────
set -g remain-on-exit off
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename off
set -g base-index 1
set -g pane-base-index 1
set -g pane-border-status off
set -g bell-action none
set -g window-status-current-style 'underscore'

# ── Interaction ─────────────────────────────────────────────
set -g mouse on

# ── Status Bar ──────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-style 'bg=black,fg=colour245'
set -g status-left '#[bg=black,fg=colour81,bold] #H '
set -g status-right-length 100

# Pick a random readable clock color on configuration load.
run-shell 'colors="colour39 colour45 colour51 colour81 colour82 colour118 colour154 colour190 colour207 colour213 colour219 colour220 colour226"; c=$(printf "%s\n" $colors | awk "BEGIN{srand()} {a[NR]=\$0} END{print a[int(rand()*NR)+1]}"); tmux set -g @clock_fg "$c"'

# Animated clock + date, with prefix indicator at far right.
set -g status-right '#[fg=#{@clock_fg}]#(frames="🕛 🕐 🕑 🕒 🕓 🕔 🕕 🕖 🕗 🕘 🕙 🕚"; s=$(date +%%S); i=$((s %% 12 + 1)); echo "$frames" | cut -d" " -f$i) Now is %H:%M:%S %B %d %Y #{?client_prefix,#[reverse] PREFIX #[default],}'

# ── Reload ──────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
