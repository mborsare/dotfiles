# ~/.tmux.conf

# prefix: because C-b is barbaric
unbind C-b
set -g prefix C-d
bind C-d send-prefix

# splits
bind v split-window -h
bind s split-window -v

# pane navigation (prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane navigation (no prefix)
bind -n M-[ select-pane -L
bind -n M-] select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# pane resizing
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5

# window lifecycle
set -g remain-on-exit off
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename off

# pane labels
set -g pane-border-status off
set -g pane-border-format "#{window_index}.#{pane_index} #{pane_current_command}"

# quality of life
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g bell-action none
set -g window-status-current-style 'underscore'
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# status bar
set -g status on
set -g status-interval 1

set -g status-style 'bg=black,fg=colour245'
set -g status-left '#[bg=black,fg=colour81,bold] #H '

# Random readable AA-ish clock/date color on tmux load/reload.
# Curated for black background.
run-shell -b 'colors="colour39 colour45 colour51 colour81 colour82 colour118 colour154 colour190 colour207 colour213 colour219 colour220 colour226"; c=$(printf "%s\n" $colors | awk "BEGIN{srand()} {a[NR]=\$0} END{print a[int(rand()*NR)+1]}"); tmux set -g status-right-style "bg=black,fg=$c"; tmux set -g @clock_fg "$c"'

set -g status-right '#(frames="🕛 🕐 🕑 🕒 🕓 🕔 🕕 🕖 🕗 🕘 🕙 🕚"; s=$(date +%%S); i=$((s %% 12 + 1)); echo "$frames" | cut -d" " -f$i) Now is %H:%M:%S %B %d %Y'

bind r source-file ~/.tmux.conf \; display "Config reloaded!"
